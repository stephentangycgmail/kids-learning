<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Grammar Topic Quiz / Challenge | Kids Learning</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/grammar_practice.css"></head>
<body>
  <header class="site-header"><a class="back-link" href="grammar_practice.html">← Grammar Practice</a><div><p class="eyebrow">Grammar Topic</p><h1>Quiz / Challenge</h1><p class="zh-text">文法主題測驗 / 挑戰</p></div><a class="header-link" href="grammar_practice_history.html">Practice History</a></header>
  <main class="page-shell">
    <div id="choiceMessage" class="notice notice-error" role="alert" hidden></div>
    <section id="choiceSetup" class="setup-panel"><div class="section-heading"><div><p class="eyebrow">New Quiz</p><h2>Choose your Grammar Topic</h2></div><p>10 questions. Answers appear after completion.</p></div>
      <label class="field-label" for="choiceTopic">Grammar topic</label><select id="choiceTopic" class="select-control"></select>
      <div class="setup-actions"><a id="learningLink" class="button button-secondary" href="grammar.html">Back to Learning</a><button id="choiceStart" class="button button-accent button-large" type="button">Start Quiz / Challenge (10)</button></div>
      <p class="privacy-note">Records stay only in this browser and device.</p>
    </section>
    <section id="choicePanel" class="practice-panel" hidden><div class="practice-toolbar"><div><p id="choiceMeta" class="eyebrow"></p><h2 id="choicePosition">Question</h2></div><div class="progress-copy"><strong id="choiceProgress"></strong><span id="choiceSave" aria-live="polite">Saved</span></div></div><article id="choiceQuestion" class="question-card" aria-live="polite"></article></section>
  </main>
  <script src="js/grammar_practice_core.js"></script><script src="js/grammar_practice_storage.js"></script><script src="js/grammar_practice_choice.js"></script>
</body></html>
